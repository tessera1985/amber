name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Amber.xcodeproj -scheme Amber -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build

      - name: Package
        run: |
          app=build/Build/Products/Release/Amber.app
          # Ad-hoc signature (no Apple Developer account). Apple Silicon needs at least this to run.
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          test -f "$app/Contents/Resources/save-tweet"
          ditto -c -k --keepParent "$app" Amber.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Amber
          path: Amber.zip

      # Every build of main publishes (or refreshes) the Release for the version in project.yml.
      - name: Read version
        if: github.ref == 'refs/heads/main'
        id: version
        run: echo "version=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)" >> "$GITHUB_OUTPUT"

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Amber ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Amber.zip
          body: |
            Download **Amber.zip** below, unzip, drag Amber into Applications.
            First launch: see [Install](https://github.com/tessera1985/amber#install).
