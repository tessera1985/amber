name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Amber.xcodeproj -scheme Amber -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build

      - name: Package
        run: |
          app=build/Build/Products/Release/Amber.app
          # Ad-hoc signature (no Apple Developer account). Apple Silicon needs at least this to run.
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          test -f "$app/Contents/Resources/save-tweet"
          ditto -c -k --keepParent "$app" Amber.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Amber
          path: Amber.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Amber.zip
